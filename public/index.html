<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCMC Travel Assistant (Test Skeleton)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>HCMC Travel Assistant</h1>
    <p class="subtitle">Walking Skeleton & End-to-End Test Interface</p>

    <div id="health-badge" class="health-badge">Checking system status...</div>

    <form id="chat-form">
      <div class="input-group">
        <input 
          type="text" 
          id="message-input" 
          placeholder="Ask a question (e.g. Best street food in HCMC?)..." 
          required 
          autocomplete="off"
        />
        <button type="submit" id="submit-btn">Send</button>
      </div>
    </form>

    <div id="loading" class="status-msg loading" style="display: none;">
      Thinking... Waiting for Gemini response...
    </div>

    <div id="error-box" class="status-msg error" style="display: none;"></div>

    <div id="answer-section" class="answer-box" style="display: none;">
      <h3>Response:</h3>
      <div id="answer-text"></div>
      <div id="sources-container" style="display: none; margin-top: 14px; border-top: 1px dashed #ddd; padding-top: 10px;">
        <h4 style="font-size: 0.85rem; color: #64748b; margin-bottom: 6px;">Retrieved Sources:</h4>
        <ul id="sources-list" style="list-style-type: none; padding-left: 0; font-size: 0.85rem; color: #475569;"></ul>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
