services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hcmc-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.60}
      - TOP_K=${TOP_K:-3}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-hcmc_travel}
      - KNOWLEDGE_DIR=/app/data/knowledge
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hcmc-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
